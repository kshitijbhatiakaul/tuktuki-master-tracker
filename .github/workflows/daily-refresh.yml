# Refreshes the tracker without Claude: OneDrive workbooks (Daily Ads report, Instagram, Business tracker,
# Influencer dashboard) + Adjust (installs, retention, channels, cohorts, purchases, MAU, OEM), then rebuilds
# docs/index.html and pushes (GitHub Pages updates).
# Runs several times a day so a workbook updated later in the day still shows up the same day.
# Also runs when Claude pushes the Monday admin-panel data, so it appears straight away.
name: Daily workbook refresh
on:
  schedule:
    - cron: "40 3 * * *"    # 09:10 IST
    - cron: "40 6 * * *"    # 12:10 IST
    - cron: "40 9 * * *"    # 15:10 IST
    - cron: "40 12 * * *"   # 18:10 IST
    - cron: "40 16 * * *"   # 22:10 IST
  push:
    branches: [main]
    paths: ["data/behaviour/admin/**", "data/behaviour/ga/**", "source/**", "build.py", "tools/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc > /dev/null
          pip install -q openpyxl beautifulsoup4
      - name: Download from OneDrive
        env:
          MS_CLIENT_ID: 90ea05bc-7d0a-42c0-a921-041294dd144a
          MS_TENANT_ID: 6b3d2c3e-7f87-4d9a-b903-6e948c86a7b0
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          RT_OUT: ${{ runner.temp }}/rt
        run: python3 tools/onedrive.py fetch "${{ runner.temp }}/staged"
      - name: Keep the OneDrive sign-in fresh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s "${{ runner.temp }}/rt" ]; then gh secret set MS_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "${{ runner.temp }}/rt"; fi
          rm -f "${{ runner.temp }}/rt"
      - name: Adjust data
        continue-on-error: true
        env:
          ADJUST_API_TOKEN: ${{ secrets.ADJUST_API_TOKEN }}
        run: |
          if [ -z "$ADJUST_API_TOKEN" ]; then echo "ADJUST_API_TOKEN not set yet - Adjust data left as it was"; exit 0; fi
          python3 tools/adjust_fetch.py
      - name: Recalculate, export, build
        run: |
          S="${{ runner.temp }}/staged"; R="${{ runner.temp }}/recalc"; mkdir -p "$R"
          soffice --headless --calc --convert-to xlsx:"Calc MS Excel 2007 XML" --outdir "$R" "$S"/*.xlsx
          python3 tools/export_sheets.py "$R" "$S"
          python3 tools/export_engine.py "$R/Updated Tuktuki Meta Daily Report.xlsx" "$S/engine"
          python3 build.py build
      - name: Commit and push
        run: |
          git config user.name "tracker-refresh[bot]"
          git config user.email "tracker-refresh@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Tracker refresh $(TZ=Asia/Kolkata date '+%F %H:%M') IST (GitHub Actions)"
          git pull --rebase -X theirs origin main || true
          python3 build.py build && git add -A docs && git commit -q --amend --no-edit || true
          git push
